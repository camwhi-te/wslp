name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "VERSION=$PKG_VERSION" >> "$GITHUB_ENV"

      - name: Test
        run: npm test

      - name: Package
        run: npx --yes @vscode/vsce@3.2.1 package --skip-license --out "wslp-${VERSION}.vsix"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wslp-${{ env.VERSION }}
          path: wslp-${{ env.VERSION }}.vsix

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "wslp-${VERSION}.vsix" \
            --title "WSLP $GITHUB_REF_NAME" \
            --generate-notes
